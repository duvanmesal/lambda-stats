name: Deploy Module 3 - URL Stats Lambda

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'lambda-modules/module-3-stats/**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '20'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: lambda-modules/module-3-stats/package-lock.json

      - name: Install dependencies
        working-directory: lambda-modules/module-3-stats
        run: npm ci

      - name: Run linting
        working-directory: lambda-modules/module-3-stats
        run: npm run lint

      - name: Run tests
        working-directory: lambda-modules/module-3-stats
        run: npm test

  build:
    name: Build Lambda Package
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        working-directory: lambda-modules/module-3-stats
        run: npm ci --production

      - name: Build TypeScript
        working-directory: lambda-modules/module-3-stats
        run: npm run build

      - name: Create deployment package
        working-directory: lambda-modules/module-3-stats
        run: |
          cd dist
          zip -r ../lambda.zip .
          cd ..
          zip -r lambda.zip node_modules

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: lambda-modules/module-3-stats/lambda.zip

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-package
          path: lambda-modules/module-3-stats

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: lambda-modules/module-3-stats/terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: lambda-modules/module-3-stats/terraform
        run: |
          terraform plan \
            -var="lambda_zip_path=../lambda.zip" \
            -var="dynamodb_table_name=${{ secrets.DYNAMODB_TABLE_NAME }}" \
            -var="dynamodb_table_arn=${{ secrets.DYNAMODB_TABLE_ARN }}" \
            -var="api_gateway_id=${{ secrets.API_GATEWAY_ID }}" \
            -var="api_gateway_execution_arn=${{ secrets.API_GATEWAY_EXECUTION_ARN }}"

      - name: Terraform Apply
        working-directory: lambda-modules/module-3-stats/terraform
        run: |
          terraform apply -auto-approve \
            -var="lambda_zip_path=../lambda.zip" \
            -var="dynamodb_table_name=${{ secrets.DYNAMODB_TABLE_NAME }}" \
            -var="dynamodb_table_arn=${{ secrets.DYNAMODB_TABLE_ARN }}" \
            -var="api_gateway_id=${{ secrets.API_GATEWAY_ID }}" \
            -var="api_gateway_execution_arn=${{ secrets.API_GATEWAY_EXECUTION_ARN }}"

      - name: Output deployment info
        working-directory: lambda-modules/module-3-stats/terraform
        run: terraform output
