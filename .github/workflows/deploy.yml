name: Deploy Module 3 - URL Stats Lambda

on:
  push:
    branches:
      - master
      - main
      - develop
    paths:
      - '**'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1
  NODE_VERSION: '20'

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Run linting
        run: npm run lint

      - name: Run tests
        run: npm test

  build:
    name: Build Lambda Package
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies (prod + dev)
        run: npm install

      - name: Build TypeScript
        run: npm run build

      - name: Create deployment package
        run: |
          mkdir -p build
          zip -r build/stats-lambda.zip dist node_modules

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lambda-package
          path: build/stats-lambda.zip

  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: lambda-package
          path: build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform
        run: terraform init

      - name: Terraform Plan
        working-directory: terraform
        run: |
          terraform plan \
            -var="lambda_zip_path=../build/stats-lambda.zip" \
            -var="dynamodb_table_name=${{ secrets.DYNAMODB_TABLE_NAME }}" \
            -var="dynamodb_table_arn=${{ secrets.DYNAMODB_TABLE_ARN }}" \
            -var="api_gateway_id=${{ secrets.API_GATEWAY_ID }}" \
            -var="api_gateway_execution_arn=${{ secrets.API_GATEWAY_EXECUTION_ARN }}"

      - name: Terraform Apply
        working-directory: terraform
        run: |
          terraform apply -auto-approve \
            -var="lambda_zip_path=../build/stats-lambda.zip" \
            -var="dynamodb_table_name=${{ secrets.DYNAMODB_TABLE_NAME }}" \
            -var="dynamodb_table_arn=${{ secrets.DYNAMODB_TABLE_ARN }}" \
            -var="api_gateway_id=${{ secrets.API_GATEWAY_ID }}" \
            -var="api_gateway_execution_arn=${{ secrets.API_GATEWAY_EXECUTION_ARN }}"

      - name: Output deployment info
        working-directory: terraform
        run: terraform output
